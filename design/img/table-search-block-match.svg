<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-label="Eight lanes of one block pass through AND with the broadcast owners, compare with the stored owners, and a test against the target bit. Lanes 1, 4 and 6 match; lanes 1 and 4 also decide. Popcount of the mask picks lane 4.">
<style>
svg { color: #18211d; }
text { font-family: ui-monospace, monospace; }
.fill-felt { fill: #1d6b4c; }
.fill-felt-soft { fill: #e2efe8; }
.fill-heart { fill: #b3312f; }
.fill-heart-soft { fill: #f6e3e1; }
.stroke-felt { stroke: #1d6b4c; }
.stroke-heart { stroke: #b3312f; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3ebe6; }
  .fill-felt { fill: #5cc497; }
  .fill-felt-soft { fill: #1b3329; }
  .fill-heart { fill: #f08a80; }
  .fill-heart-soft { fill: #3a2221; }
  .stroke-felt { stroke: #5cc497; }
  .stroke-heart { stroke: #f08a80; }
}
</style>

  <g font-size="11" fill="currentColor">
    <text x="20" y="24" font-weight="600">lane</text>
    <text x="236" y="24" text-anchor="middle">0</text><text x="296" y="24" text-anchor="middle">1</text><text x="356" y="24" text-anchor="middle">2</text><text x="416" y="24" text-anchor="middle">3</text>
    <text x="476" y="24" text-anchor="middle">4</text><text x="536" y="24" text-anchor="middle">5</text><text x="596" y="24" text-anchor="middle">6</text><text x="656" y="24" text-anchor="middle">7</text>
  </g>
  <!-- row labels -->
  <g font-size="11" fill="currentColor">
    <text x="20" y="58">vb = load b-line</text>
    <text x="20" y="74" opacity="0.6" font-size="10">mask | verdict</text>
    <text x="20" y="114">vb &amp; own == a</text>
    <text x="20" y="130" opacity="0.6" font-size="10">vpandq, vpcmpeqq</text>
    <text x="20" y="170">vb tests dec</text>
    <text x="20" y="186" opacity="0.6" font-size="10">vptestmq</text>
    <text x="20" y="226">kd = k &amp; t</text>
    <text x="20" y="242" opacity="0.6" font-size="10">kandb</text>
    <text x="20" y="282">popcnt(b &amp; m)&lt;&lt;3 | i</text>
    <text x="20" y="298" opacity="0.6" font-size="10">vpopcntq, vpsllq, vporq</text>
    <text x="20" y="338">masked min over kd</text>
    <text x="20" y="354" opacity="0.6" font-size="10">reduce_min_epu64</text>
  </g>
  <!-- row 1: b words -->
  <g font-size="10" fill="currentColor" text-anchor="middle">
    <rect x="210" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="236" y="63">empty</text>
    <rect x="270" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="296" y="63">5 cards</text>
    <rect x="330" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="356" y="63">3 cards</text>
    <rect x="390" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="416" y="63">6 cards</text>
    <rect x="450" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="476" y="63">3 cards</text>
    <rect x="510" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="536" y="63">4 cards</text>
    <rect x="570" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="596" y="63">2 cards</text>
    <rect x="630" y="44" width="52" height="30" fill="none" stroke="currentColor"/><text x="656" y="63">empty</text>
  </g>
  <!-- row 2: owners match -->
  <g font-size="12" text-anchor="middle" font-weight="600">
    <text x="236" y="120" fill="currentColor" opacity="0.4">0</text>
    <text class="fill-felt" x="296" y="120" fill="#1d6b4c">1</text>
    <text x="356" y="120" fill="currentColor" opacity="0.4">0</text>
    <text x="416" y="120" fill="currentColor" opacity="0.4">0</text>
    <text class="fill-felt" x="476" y="120" fill="#1d6b4c">1</text>
    <text x="536" y="120" fill="currentColor" opacity="0.4">0</text>
    <text class="fill-felt" x="596" y="120" fill="#1d6b4c">1</text>
    <text x="656" y="120" fill="currentColor" opacity="0.4">0</text>
  </g>
  <!-- row 3: decides target -->
  <g font-size="12" text-anchor="middle" font-weight="600">
    <text x="236" y="176" fill="currentColor" opacity="0.4">0</text>
    <text class="fill-heart" x="296" y="176" fill="#b3312f">1</text>
    <text class="fill-heart" x="356" y="176" fill="#b3312f">1</text>
    <text x="416" y="176" fill="currentColor" opacity="0.4">0</text>
    <text class="fill-heart" x="476" y="176" fill="#b3312f">1</text>
    <text class="fill-heart" x="536" y="176" fill="#b3312f">1</text>
    <text x="596" y="176" fill="currentColor" opacity="0.4">0</text>
    <text x="656" y="176" fill="currentColor" opacity="0.4">0</text>
  </g>
  <!-- row 4: kd -->
  <g font-size="12" text-anchor="middle" font-weight="600">
    <text x="236" y="232" fill="currentColor" opacity="0.4">0</text>
    <rect class="fill-felt-soft stroke-felt" x="276" y="214" width="40" height="26" fill="#e2efe8" stroke="#1d6b4c"/><text class="fill-felt" x="296" y="232" fill="#1d6b4c">1</text>
    <text x="356" y="232" fill="currentColor" opacity="0.4">0</text>
    <text x="416" y="232" fill="currentColor" opacity="0.4">0</text>
    <rect class="fill-felt-soft stroke-felt" x="456" y="214" width="40" height="26" fill="#e2efe8" stroke="#1d6b4c"/><text class="fill-felt" x="476" y="232" fill="#1d6b4c">1</text>
    <text x="536" y="232" fill="currentColor" opacity="0.4">0</text>
    <text x="596" y="232" fill="currentColor" opacity="0.4">0</text>
    <text x="656" y="232" fill="currentColor" opacity="0.4">0</text>
  </g>
  <!-- row 5: keys -->
  <g font-size="11" text-anchor="middle" fill="currentColor">
    <text x="296" y="288">5·8+1 = 41</text>
    <text x="476" y="288">3·8+4 = 28</text>
  </g>
  <!-- row 6: winner -->
  <rect class="fill-heart-soft stroke-heart" x="426" y="322" width="100" height="28" fill="#f6e3e1" stroke="#b3312f" stroke-width="1.5"/>
  <text class="fill-heart" x="476" y="341" font-size="12" text-anchor="middle" fill="#b3312f" font-weight="600">28 → lane 4</text>
  <line class="stroke-heart" x1="476" y1="296" x2="476" y2="318" stroke="#b3312f" marker-end="url(#ar2)"/>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-heart" d="M0,0 L10,5 L0,10 z" fill="#b3312f"/></marker></defs>
  <text x="20" y="386" font-size="10" fill="currentColor" opacity="0.7"><tspan x="20">Illustrative values. Lane 6 has the right owners but its verdict does not cover this target;</tspan><tspan x="20" dy="14">lane 2 covers the target but a relevant card has moved.</tspan></text>
</svg>
