<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="A directory slot with key, generation and head index points to the newest block in the pool; each block links through next[] to the older block of the same key until NIL.">
<style>
svg { color: #18211d; }
text { font-family: ui-monospace, monospace; }
.fill-felt { fill: #1d6b4c; }
.fill-felt-soft { fill: #e2efe8; }
.fill-surface { fill: #ffffff; }
.stroke-felt { stroke: #1d6b4c; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3ebe6; }
  .fill-felt { fill: #5cc497; }
  .fill-felt-soft { fill: #1b3329; }
  .fill-surface { fill: #171e1b; }
  .stroke-felt { stroke: #5cc497; }
}
</style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <text x="20" y="24" font-size="12" fill="currentColor" font-weight="600"><tspan x="20" y="11">directory</tspan><tspan x="20" y="25">(16-byte slots, open addressing)</tspan></text>
  <rect x="20" y="36" width="210" height="26" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="125" y="54" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.6">other key</text>
  <rect class="fill-felt-soft stroke-felt" x="20" y="62" width="210" height="44" fill="#e2efe8" stroke="#1d6b4c" stroke-width="1.5"/>
  <text x="30" y="80" font-size="11" fill="currentColor">key54 | hint | cnt</text>
  <text x="30" y="98" font-size="11" fill="currentColor">gen = tt.gen   head</text>
  <rect x="20" y="106" width="210" height="26" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="125" y="124" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.6">stale gen = empty</text>
  <text x="20" y="160" font-size="11" fill="currentColor" opacity="0.75">h = (key54 * 0x9E37…15) &gt;&gt; (64 - bits)</text>
  <text x="20" y="178" font-size="11" fill="currentColor" opacity="0.75">probe h, h+1, … until gen differs</text>

  <text x="290" y="24" font-size="12" fill="currentColor" font-weight="600"><tspan x="290" y="11">pool</tspan><tspan x="290" y="25">(64-byte lines, handed out in order, reset per deal)</tspan></text>
  <!-- newest block -->
  <rect class="fill-surface" x="290" y="62" width="200" height="44" fill="#ffffff" stroke="currentColor"/>
  <text x="390" y="80" font-size="11" fill="currentColor" text-anchor="middle">newest block (cnt used)</text>
  <text x="390" y="98" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.7">8 patterns</text>
  <!-- older -->
  <rect class="fill-surface" x="540" y="62" width="200" height="44" fill="#ffffff" stroke="currentColor"/>
  <text x="640" y="80" font-size="11" fill="currentColor" text-anchor="middle">older block (full)</text>
  <text x="640" y="98" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.7">8 patterns</text>
  <rect class="fill-surface" x="540" y="150" width="200" height="44" fill="#ffffff" stroke="currentColor"/>
  <text x="640" y="168" font-size="11" fill="currentColor" text-anchor="middle">oldest block (full)</text>
  <text x="640" y="186" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.7">8 patterns</text>
  <text x="640" y="236" font-size="11" fill="currentColor" text-anchor="middle">NIL</text>

  <line x1="230" y1="96" x2="288" y2="90" stroke="currentColor" marker-end="url(#ar)"/>
  <text x="259" y="112" font-size="10" fill="currentColor" text-anchor="middle">head</text>
  <line x1="490" y1="84" x2="538" y2="84" stroke="currentColor" marker-end="url(#ar)"/>
  <text x="514" y="76" font-size="10" fill="currentColor" text-anchor="middle">next[]</text>
  <line x1="640" y1="106" x2="640" y2="148" stroke="currentColor" marker-end="url(#ar)"/>
  <text x="648" y="132" font-size="10" fill="currentColor">next[]</text>
  <line x1="640" y1="194" x2="640" y2="222" stroke="currentColor" marker-end="url(#ar)"/>
  <text x="648" y="212" font-size="10" fill="currentColor">next[]</text>

  <rect class="stroke-felt" x="290" y="150" width="200" height="44" fill="none" stroke="#1d6b4c" stroke-dasharray="4 3"/>
  <text class="fill-felt" x="390" y="168" font-size="11" fill="#1d6b4c" text-anchor="middle">store when cnt == 8:</text>
  <text class="fill-felt" x="390" y="186" font-size="11" fill="#1d6b4c" text-anchor="middle">new block becomes head</text>
  <text x="390" y="230" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.75">lookup walks newest → oldest</text>
</svg>
