<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-label="Bit layouts. Narrow entry: word a holds the two 28-bit masked owner strings; word b holds the mask twice, seven decided-target bits and the answer bit. Wide entry: w0 holds a 52-bit mask, lo and hi; w1 and w2 hold the masked owner strings. Blocks store the eight entries' words as separate 64-byte lines.">
<style>
svg { color: #18211d; }
text { font-family: ui-monospace, monospace; }
.fill-felt { fill: #1d6b4c; }
.fill-felt-soft { fill: #e2efe8; }
.fill-heart { fill: #b3312f; }
.fill-heart-soft { fill: #f6e3e1; }
.stroke-heart { stroke: #b3312f; }
@media (prefers-color-scheme: dark) {
  svg { color: #e3ebe6; }
  .fill-felt { fill: #5cc497; }
  .fill-felt-soft { fill: #1b3329; }
  .fill-heart { fill: #f08a80; }
  .fill-heart-soft { fill: #3a2221; }
  .stroke-heart { stroke: #f08a80; }
}
</style>

  <!-- scale: bit b spans x = 100 + (63-b)*10 .. +10 -->
  <text x="100" y="20" font-size="10" fill="currentColor" opacity="0.7">bit 63</text>
  <text x="740" y="20" font-size="10" fill="currentColor" text-anchor="end" opacity="0.7">bit 0</text>
  <text x="180" y="20" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.7">56</text>
  <text x="460" y="20" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.7">28</text>
  <text class="fill-felt" x="20" y="44" font-size="12" font-weight="600" fill="#1d6b4c">NARROW</text>

  <text x="92" y="66" font-size="12" fill="currentColor" text-anchor="end">a</text>
  <rect x="100" y="50" width="80" height="26" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="140" y="67" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.6">0</text>
  <rect class="fill-felt-soft" x="180" y="50" width="280" height="26" fill="#e2efe8" stroke="currentColor"/>
  <text x="320" y="67" font-size="11" fill="currentColor" text-anchor="middle">swq &amp; m  (S/W owner bits)</text>
  <rect class="fill-felt-soft" x="460" y="50" width="280" height="26" fill="#e2efe8" stroke="currentColor"/>
  <text x="600" y="67" font-size="11" fill="currentColor" text-anchor="middle">ewq &amp; m  (E/W owner bits)</text>

  <text x="92" y="102" font-size="12" fill="currentColor" text-anchor="end">b</text>
  <rect class="fill-heart-soft stroke-heart" x="100" y="86" width="10" height="26" fill="#f6e3e1" stroke="#b3312f"/>
  <rect class="fill-heart-soft stroke-heart" x="110" y="86" width="70" height="26" fill="#f6e3e1" stroke="#b3312f"/>
  <text class="fill-heart" x="145" y="103" font-size="10" fill="#b3312f" text-anchor="middle">t=7 … 1</text>
  <rect x="180" y="86" width="280" height="26" fill="none" stroke="currentColor"/>
  <text x="320" y="103" font-size="11" fill="currentColor" text-anchor="middle">m  (cards that mattered)</text>
  <rect x="460" y="86" width="280" height="26" fill="none" stroke="currentColor"/>
  <text x="600" y="103" font-size="11" fill="currentColor" text-anchor="middle">m  (same mask again)</text>
  <text class="fill-heart" x="105" y="128" font-size="10" fill="#b3312f" text-anchor="middle">ans</text>
  <text x="300" y="128" font-size="10" fill="currentColor" opacity="0.7">bit 63 = answer; bit 55+t set ⇔ entry decides target t</text>

  <text class="fill-felt" x="20" y="166" font-size="12" font-weight="600" fill="#1d6b4c">WIDE</text>
  <text x="220" y="166" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.7">52</text>
  <text x="92" y="188" font-size="12" fill="currentColor" text-anchor="end">w0</text>
  <rect x="100" y="172" width="40" height="26" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <rect class="fill-heart-soft stroke-heart" x="140" y="172" width="40" height="26" fill="#f6e3e1" stroke="#b3312f"/>
  <text class="fill-heart" x="160" y="189" font-size="10" fill="#b3312f" text-anchor="middle">hi</text>
  <rect class="fill-heart-soft stroke-heart" x="180" y="172" width="40" height="26" fill="#f6e3e1" stroke="#b3312f"/>
  <text class="fill-heart" x="200" y="189" font-size="10" fill="#b3312f" text-anchor="middle">lo</text>
  <rect x="220" y="172" width="520" height="26" fill="none" stroke="currentColor"/>
  <text x="480" y="189" font-size="11" fill="currentColor" text-anchor="middle">m  (up to 52 cards present)</text>
  <text x="92" y="222" font-size="12" fill="currentColor" text-anchor="end">w1</text>
  <rect x="100" y="206" width="120" height="26" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <rect class="fill-felt-soft" x="220" y="206" width="520" height="26" fill="#e2efe8" stroke="currentColor"/>
  <text x="480" y="223" font-size="11" fill="currentColor" text-anchor="middle">ewq &amp; m</text>
  <text x="92" y="256" font-size="12" fill="currentColor" text-anchor="end">w2</text>
  <rect x="100" y="240" width="120" height="26" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <rect class="fill-felt-soft" x="220" y="240" width="520" height="26" fill="#e2efe8" stroke="currentColor"/>
  <text x="480" y="257" font-size="11" fill="currentColor" text-anchor="middle">swq &amp; m</text>

  <!-- block layout -->
  <text x="20" y="302" font-size="12" font-weight="600" fill="currentColor">BLOCK = 8 entries, stored by word (structure of arrays)</text>
  <text x="92" y="333" font-size="11" fill="currentColor" text-anchor="end">narrow</text>
  <g font-size="10" fill="currentColor" text-anchor="middle">
    <rect class="fill-felt-soft" x="100" y="316" width="300" height="26" fill="#e2efe8" stroke="currentColor"/>
    <text x="250" y="333">line 0: a[0] a[1] … a[7]  (e[0..7])</text>
    <rect x="410" y="316" width="300" height="26" fill="none" stroke="currentColor"/>
    <text x="560" y="333">line 1: b[0] … b[7]  (e[8..15])</text>
  </g>
  <text x="92" y="373" font-size="11" fill="currentColor" text-anchor="end">wide</text>
  <g font-size="10" fill="currentColor" text-anchor="middle">
    <rect x="100" y="356" width="196" height="26" fill="none" stroke="currentColor"/>
    <text x="198" y="373">line 0: w0[0..7]</text>
    <rect class="fill-felt-soft" x="306" y="356" width="196" height="26" fill="#e2efe8" stroke="currentColor"/>
    <text x="404" y="373">line 1: w1[0..7]</text>
    <rect class="fill-felt-soft" x="512" y="356" width="196" height="26" fill="#e2efe8" stroke="currentColor"/>
    <text x="610" y="373">line 2: w2[0..7]</text>
  </g>
  <text x="100" y="404" font-size="10" fill="currentColor" opacity="0.7"><tspan x="100">each line is one zmm load. Empty slot: narrow a = ~0, b = 0;</tspan><tspan x="100" dy="14">wide w0 = 0, w1 = w2 = ~0. Neither can ever match.</tspan></text>
</svg>
