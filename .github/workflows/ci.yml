# Exactness tests against DDS (scripts/ci.sh) on every push to a pull request and to main.
#   linux-x86   every time: the AVX-512 path, native on a runner with AVX-512, else emulated
#               with Intel SDE.
#   linux-x86-hwy  every time: the Highway path on x86 without AVX-512, for x86-64-v3 (AVX2,
#               BMI2) and x86-64-v2 (SSE4.2, no BMI2: the table pext/pdep). The v3 build is also
#               run under SDE as a Sandy Bridge (no AVX2, no BMI2), where it must stop at load
#               with ddfast's CPU message (status 1), not crash on an illegal instruction.
#   linux-arm   every time: the Highway path (AArch64) on Linux (ELF, clang/GCC).
#   macos       every time: the Highway path with Apple clang and the macOS system code.
#   ci-ok       the one check to require in branch protection: passes when every job above
#               passed or was skipped.
# The Highway jobs build against the same pinned Highway release (HWY_VERSION; headers only).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays: everything, to catch runner-image changes
  workflow_dispatch:

env:
  HWY_VERSION: "1.4.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      simd: ${{ github.event_name != 'pull_request' || steps.f.outputs.simd == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            simd:
              - 'src/solver.cpp'
              - 'src/port.hpp'
              - 'src/tables.cpp'
              - 'scripts/build.sh'
              - 'scripts/ci.sh'
              - '.github/workflows/ci.yml'

  linux-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Ice Lake's AVX-512 set (VBMI2, VPOPCNTDQ, BITALG, GFNI): a subset of Zen 4/5 and Ice
      # Lake and later Xeons, and what SDE emulates with -icx.
      ARCH: -march=icelake-server
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: CPU
        id: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo
          f=$(grep -m1 '^flags' /proc/cpuinfo)
          native=true
          for x in avx512f avx512vl avx512bw avx512dq avx512cd avx512vbmi avx512_vbmi2 avx512_vpopcntdq avx512_bitalg gfni bmi2; do
            case " $f " in *" $x "*) ;; *) echo "missing $x"; native=false ;; esac
          done
          echo "native=$native" >> "$GITHUB_OUTPUT"
      - uses: petarpetrovt/setup-sde@v2.4
        if: steps.cpu.outputs.native != 'true'
      - uses: actions/cache@v4
        with:
          path: build/tables
          key: tables-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tables.cpp', 'src/tables.hpp', 'src/position.hpp') }}
      - name: Build and test (native AVX-512)
        if: steps.cpu.outputs.native == 'true'
        run: sh scripts/ci.sh
      - name: Build and test (AVX-512 under Intel SDE)
        if: steps.cpu.outputs.native != 'true'
        env:
          # SDE is far slower: a smaller set.
          TESTS: random 30 1
          PLAY: 10 1
        run: RUN="$SDE_PATH/sde64 -icx --" sh scripts/ci.sh

  linux-x86-hwy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64-v3, x86-64-v2]
    env:
      ARCH: -march=${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: google/highway
          ref: ${{ env.HWY_VERSION }}
          path: highway
      - uses: actions/cache@v4
        with:
          path: build/tables
          key: tables-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tables.cpp', 'src/tables.hpp', 'src/position.hpp') }}
      - name: Build and test
        run: HWY_INC=$PWD/highway sh scripts/ci.sh
      - uses: petarpetrovt/setup-sde@v2.4
        if: matrix.arch == 'x86-64-v3'
      - name: CPU check on a CPU without AVX2 and BMI2 (SDE as Sandy Bridge)
        if: matrix.arch == 'x86-64-v3'
        run: |
          set +e
          out=$("$SDE_PATH/sde64" -snb -- bin/ddfast --cpu 2>&1); st=$?
          echo "$out"
          [ $st -eq 1 ] && echo "$out" | grep -q 'this CPU lacks (.*AVX2.*LZCNT.*BMI2)'

  linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: google/highway
          ref: ${{ env.HWY_VERSION }}
          path: highway
      - uses: actions/cache@v4
        with:
          path: build/tables
          key: tables-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tables.cpp', 'src/tables.hpp', 'src/position.hpp') }}
      - name: Build and test
        run: HWY_INC=$PWD/highway sh scripts/ci.sh

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: google/highway
          ref: ${{ env.HWY_VERSION }}
          path: highway
      - uses: actions/cache@v4
        with:
          path: build/tables
          key: tables-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tables.cpp', 'src/tables.hpp', 'src/position.hpp') }}
      - name: Build and test
        run: HWY_INC=$PWD/highway sh scripts/ci.sh

  ci-ok:
    if: always()
    needs: [changes, linux-x86, linux-x86-hwy, linux-arm, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          ! echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'
